name: Import ZIP from Google Drive

on:
  workflow_dispatch:
    inputs:
      drive_link:
        description: "Google Drive share link or file ID"
        required: true
        type: string

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Install gdown
        run: pip install gdown

      - name: Download ZIP
        shell: bash
        run: |
         INPUT="${{ github.event.inputs.drive_link }}"

         if [[ "$INPUT" =~ /file/d/([^/]+) ]]; then
           FILE_ID="${BASH_REMATCH[1]}"
         elif [[ "$INPUT" =~ id=([^&]+) ]]; then
           FILE_ID="${BASH_REMATCH[1]}"
         else
           FILE_ID="$INPUT"
         fi

         gdown "$FILE_ID" -O archive.zip

      - name: Extract ZIP
        run: unzip -o archive.zip -d .

      - name: Remove ZIP
        run: rm -f archive.zip cookies.txt response.html

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "fnf assets"
          git push
